apiVersion: v1 
kind: Pod 
metadata: 
 name: nginx 
spec: 
 affinity: 
  nodeAffinity: 
   # hard rule 
   requiredDuringSchedulingIgnoredDuringExecution: 
    nodeSelectorTerms: 
    - matchExpressions: 
      - key: topology.kubernetes.io/zone 
        operator: In 
        value: us-east-1c  
 containers: 
 - name: nginx 
   image: nginx 
